services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: medusa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medusa-store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medusa_network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: medusa_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - medusa_network

  # Medusa Server
  # This service runs the Medusa backend application
  # and the admin dashboard.
  medusa:
    build: .
    container_name: medusa_backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - "9000:9000"
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/medusa-store
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-supersecret}
      - COOKIE_SECRET=${COOKIE_SECRET:-supersecret}
      - STORE_CORS=${STORE_CORS:-http://localhost:8000,http://localhost:8001}
      - ADMIN_CORS=${ADMIN_CORS:-http://localhost:5173,http://localhost:9000}
      - AUTH_CORS=${AUTH_CORS:-http://localhost:5173,http://localhost:9000}
    env_file:
      - path: apps/backend/.env
        required: false
    volumes:
      - .:/server
      - /server/node_modules
      - /server/apps/backend/node_modules
    networks:
      - medusa_network
      - dokploy-network

  # Storefront 1: Alati Store
  storefront:
    build: .
    container_name: medusa_storefront_tools
    restart: unless-stopped
    depends_on:
      - medusa
    ports:
      - "8000:8000"
    environment:
      - MEDUSA_BACKEND_URL=http://medusa:9000
      - NEXT_PUBLIC_MEDUSA_BACKEND_URL=${NEXT_PUBLIC_MEDUSA_BACKEND_URL:-http://localhost:9000}
      - NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:-pk_c52cf24da68b5275b80a570128df6cde3a8fd05c8f8c8a4b5a91bd0bb87009b2}
      - NEXT_PUBLIC_STORE_CATEGORY_CHANNEL=alati
      - NEXT_PUBLIC_DEFAULT_REGION=dk
      - PORT=8000
    env_file:
      - path: apps/storefront/.env
        required: false
    volumes:
      - .:/server
      - /server/node_modules
      - /server/apps/backend/node_modules
      - /server/apps/storefront/node_modules
      - /server/apps/storefront/.next
    entrypoint: ["./start-storefront.sh"]
    networks:
      - medusa_network
      - dokploy-network

  # Storefront 2: Šminka & Kozmetika Store
  storefront_beauty:
    build: .
    container_name: medusa_storefront_beauty
    restart: unless-stopped
    depends_on:
      - medusa
    ports:
      - "8001:8001"
    environment:
      - MEDUSA_BACKEND_URL=http://medusa:9000
      - NEXT_PUBLIC_MEDUSA_BACKEND_URL=${NEXT_PUBLIC_MEDUSA_BACKEND_URL:-http://localhost:9000}
      - NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${NEXT_PUBLIC_MEDUSA_BEAUTY_PUBLISHABLE_KEY:-pk_8759d03d436cec7d41a454e3203a296c50337468ffb9d7543fbb85910697bff4}
      - NEXT_PUBLIC_STORE_CATEGORY_CHANNEL=sminka
      - NEXT_PUBLIC_DEFAULT_REGION=dk
      - PORT=8001
    env_file:
      - path: apps/storefront-beauty/.env
        required: false
    volumes:
      - .:/server
      - /server/node_modules
      - /server/apps/backend/node_modules
      - /server/apps/storefront-beauty/node_modules
      - /server/apps/storefront-beauty/.next
    entrypoint: ["./start-storefront-beauty.sh"]
    networks:
      - medusa_network
      - dokploy-network

volumes:
  postgres_data:

networks:
  medusa_network:
    driver: bridge
  dokploy-network:
    external: true